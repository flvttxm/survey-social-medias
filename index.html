<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jordyn ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: white;
            color: black;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 750px;
            text-align: center;
        }

        h1 {
            margin: 0 0 35px 0;

            font-size: clamp(45px, 9vw, 75px);
            font-weight: 700;

            letter-spacing: -3px;
        }

        .question {
            margin-bottom: 40px;

            font-size: clamp(22px, 4vw, 34px);
            line-height: 1.35;
            font-weight: 400;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        button {
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;

            padding: 13px 28px;

            border-radius: 999px;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        #yes {
            background: black;
            color: white;
            border: 2px solid black;
        }

        #yes:hover {
            transform: scale(1.06);
        }

        #no {
            background: white;
            color: black;
            border: 2px solid black;

            position: relative;
        }

        #no:hover {
            background: #f5f5f5;
        }


        /* =========================
           SUCCESS SCREEN
        ========================= */

        #success {
            display: none;

            animation: fadeIn 0.8s ease forwards;
        }

        .success-text {
            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.45;

            margin-bottom: 30px;
        }

        .photo {
            display: block;

            width: min(90vw, 450px);
            max-height: 500px;

            object-fit: cover;

            margin: 0 auto;

            border-radius: 12px;
        }

        .heart {
            margin-top: 25px;

            font-size: 24px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            h1 {
                margin-bottom: 28px;
            }

            .question {
                margin-bottom: 35px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                font-size: 16px;
                padding: 12px 23px;
            }

            .success-text {
                font-size: 24px;
            }
        }

    </style>
</head>


<body>

    <div class="container">


        <!-- =========================
             QUESTION SCREEN
        ========================= -->

        <div id="question">

            <h1>
                JORDYN ♡
            </h1>

            <div class="question">
                Wanna conquer the world with me, on a day that ends with Y? ♡
            </div>

            <div class="buttons">

                <button id="yes">
                    Yes ♡
                </button>

                <button id="no">
                    No
                </button>

            </div>

        </div>



        <!-- =========================
             SUCCESS SCREEN
        ========================= -->

        <div id="success">

            <div class="success-text">

                Knew you would say yes,<br>
                so I guess we're stuck with each other now

            </div>


            <!--
                Put your picture in the same folder
                as this index.html and call it:

                jordyn.jpg
            -->

            <img
                src="jordyn.jpg"
                alt="♡"
                class="photo"
            >


            <div class="heart">
                ♡
            </div>

        </div>

    </div>



    <script>

        const yes = document.getElementById("yes");
        const no = document.getElementById("no");

        const question = document.getElementById("question");
        const success = document.getElementById("success");

        let noCount = 0;


        /* =========================
           YES BUTTON
        ========================= */

        yes.addEventListener("click", () => {

            question.style.display = "none";

            success.style.display = "block";

        });



        /* =========================
           NO BUTTON
        ========================= */

        no.addEventListener("click", (event) => {

            event.preventDefault();

            noCount++;


            /*
                On exactly the 85th "No",
                change the question.
            */

            if (noCount === 85) {

                document.querySelector(".question").textContent =
                    "That was 85 times, are you REALLY sure?";

            }


            moveNoButton();

        });



        /* =========================
           MOVE NO BUTTON
        ========================= */

        function moveNoButton() {

            const buttonWidth = no.offsetWidth;
            const buttonHeight = no.offsetHeight;

            const padding = 25;


            const maxX =
                window.innerWidth -
                buttonWidth -
                padding;

            const maxY =
                window.innerHeight -
                buttonHeight -
                padding;


            const x =
                padding +
                Math.random() *
                (maxX - padding);

            const y =
                padding +
                Math.random() *
                (maxY - padding);


            no.style.position = "fixed";

            no.style.left = `${x}px`;
            no.style.top = `${y}px`;

        }



        /* =========================
           MAKE NO RUN AWAY
           WHEN MOUSE GETS CLOSE
        ========================= */

        document.addEventListener("mousemove", (event) => {

            if (no.style.position !== "fixed") {
                return;
            }


            const rect = no.getBoundingClientRect();


            const centerX =
                rect.left +
                rect.width / 2;

            const centerY =
                rect.top +
                rect.height / 2;


            const distance = Math.sqrt(

                Math.pow(
                    event.clientX - centerX,
                    2
                )

                +

                Math.pow(
                    event.clientY - centerY,
                    2
                )

            );


            /*
                If the mouse gets within 100px,
                the button escapes.
            */

            if (distance < 100) {

                moveNoButton();

            }

        });



        /* =========================
           MOBILE
        ========================= */

        no.addEventListener("touchstart", (event) => {

            event.preventDefault();

            moveNoButton();

        });

    </script>

</body>
</html>
